[project]
name = "appscout"
version = "0.1.0"
description = "Async, rate-limit-resilient research pipeline: how ready is an app to become an agent toolkit"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "mcp>=2.3.0",
    "openai",
    "pydantic>=2",
    "python-dotenv",
]

[project.scripts]
appscout = "appscout.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appscout"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
